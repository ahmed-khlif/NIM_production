services:
  postgres:
    image: postgres:16-alpine
    container_name: nim-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nim_production
      POSTGRES_USER: nim
      POSTGRES_PASSWORD: nim_dev_password
    ports:
      - "5432:5432"
    volumes:
      - nim_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nim -d nim_production"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  nim_postgres_data:
